<!doctype html>
<html lang="es">
<head>

  <title>Entrar al panel</title>
  <link rel="icon" href="/img/icono.svg" type="image/svg+xml">

    <small>Solo pueden entrar las cuentas invitadas como socio.</small>
  </main>

</html>
